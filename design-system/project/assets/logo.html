<!doctype html>
<html><head><meta charset="utf-8"><title>AutoMate logo</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap");
body{margin:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;background:#0F1115;color:#E6E8EC;height:100vh;font-family:Montserrat,sans-serif;gap:32px;padding:24px;box-sizing:border-box}
.mark{display:flex;align-items:center;gap:12px}
.glyph{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#3A86FF 0%,#2EC4B6 100%);display:grid;place-items:center;color:#fff;font-weight:600;font-size:22px;letter-spacing:-1px}
.word{font-weight:500;font-size:24px;letter-spacing:-0.5px}
.word b{font-weight:600;color:#3A86FF}
.mono{display:flex;flex-direction:column;align-items:center;gap:8px}
.mono .glyph{width:84px;height:84px;border-radius:20px;font-size:38px}
.mono .name{font-size:13px;color:#A1A7B3;letter-spacing:1px;text-transform:uppercase}
</style></head><body>
<div class="mark"><div class="glyph">A</div><div class="word">Auto<b>Mate</b></div></div>
<div class="mono"><div class="glyph">A</div><div class="name">AutoMate</div></div>
</body></html>

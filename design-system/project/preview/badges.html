<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);font-family:Montserrat;color:#E6E8EC;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.pill{padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:500;line-height:16px}
.warn{background:rgba(255,159,28,.20);color:#FF9F1C}
.danger{background:rgba(230,57,70,.20);color:#E63946}
.success{background:rgba(46,196,182,.20);color:#2EC4B6}
.brand{background:rgba(58,134,255,.20);color:#3A86FF}
.lab{font-size:10px;color:#6B7280;font-family:ui-monospace,Menlo,monospace;margin-left:auto}
</style></head>
<body>
<div class="row"><span class="pill warn">Upcoming</span><span class="lab">warn · scheduled</span></div>
<div class="row"><span class="pill danger">Overdue</span><span class="lab">danger · past due</span></div>
<div class="row"><span class="pill success">Completed</span><span class="lab">success · logged</span></div>
<div class="row"><span class="pill brand">Active</span><span class="lab">brand · current state</span></div>
</body></html>

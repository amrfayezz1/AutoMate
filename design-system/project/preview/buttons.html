<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);font-family:Montserrat;color:#E6E8EC;display:flex;gap:16px;flex-wrap:wrap}
.btn{font-family:Montserrat;font-weight:500;font-size:16px;line-height:24px;border:0;border-radius:16px;padding:16px 24px;cursor:pointer}
.primary{background:#3A86FF;color:#fff;width:100%}
.icon-btn{width:32px;height:32px;border-radius:9999px;background:#3A86FF;color:#fff;display:grid;place-items:center;border:0;font-size:18px;line-height:1}
.tab{padding:8px 19px;border-radius:9999px;font-weight:500;font-size:16px}
.t-on{background:#3A86FF;color:#E6E8EC}
.t-off{background:#16191F;color:#A1A7B3}
.lab{font-size:10px;color:#6B7280;font-family:ui-monospace,Menlo,monospace}
.row{display:flex;gap:10px;align-items:center;flex-direction:column}
</style></head>
<body>
<div class="row" style="flex:1 1 100%"><button class="btn primary">Save Maintenance</button><span class="lab">primary · full-width · 56h</span></div>
<div class="row"><div style="display:flex;gap:8px"><span class="tab t-on">Upcoming</span><span class="tab t-off">History</span></div><span class="lab">tab pill · 40h</span></div>
<div class="row"><button class="icon-btn">+</button><span class="lab">circular icon · 32</span></div>
</body></html>

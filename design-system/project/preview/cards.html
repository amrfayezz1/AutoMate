<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);font-family:Montserrat;color:#E6E8EC;display:flex;flex-direction:column;gap:12px}
.card{border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px}
.basic{background:#1A1D24}
.alert{background:rgba(255,159,28,.20);border:1.5px solid #FF9F1C}
.selected{background:rgba(58,134,255,.20);border:1px solid #3A86FF}
.dot{width:36px;height:36px;border-radius:9999px;background:#2A2F3A;display:grid;place-items:center;color:#3A86FF;font-weight:500}
.dot.warn{background:rgba(255,159,28,.30);color:#FF9F1C}
.dot.brand{background:#3A86FF;color:#fff}
.title{font-size:16px;font-weight:500}
.sub{font-size:14px;color:#A1A7B3}
.lab{font-size:10px;color:#6B7280;font-family:ui-monospace,Menlo,monospace;margin-left:auto;flex:none}
</style></head>
<body>
<div class="card basic"><div class="dot">✓</div><div><div class="title">Oil change completed</div><div class="sub">2 days ago</div></div><span class="lab">basic · #1A1D24</span></div>
<div class="card alert"><div class="dot warn">!</div><div><div class="title">Next Due — Oil Change</div><div class="sub" style="color:#FF9F1C">500 km left</div></div><span class="lab">alert · 1.5px warn</span></div>
<div class="card selected"><div class="dot brand">⚙</div><div><div class="title">Renault Sandero</div><div class="sub">ABC-1234</div></div><span class="lab">selected · 1px brand</span></div>
</body></html>

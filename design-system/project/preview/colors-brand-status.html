<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--color-bg);display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-family:Montserrat}
.sw{height:96px;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;padding:12px;font-size:12px;font-weight:500;color:#E6E8EC;font-family:Montserrat}
.sw .h{font-size:10px;color:rgba(255,255,255,.7);font-family:ui-monospace,Menlo,monospace}
.lab{font-size:11px;color:#A1A7B3;font-weight:500;margin-top:2px}
.row{display:flex;gap:6px}
.dot{width:18px;height:18px;border-radius:50%}
</style></head>
<body>
<div class="sw" style="background:#3A86FF;color:#fff">
  <div>brand · primary</div>
  <div><div class="row"><span class="dot" style="background:#3A86FF"></span><span class="dot" style="background:rgba(58,134,255,.3)"></span><span class="dot" style="background:rgba(58,134,255,.2)"></span></div><div class="h">#3A86FF</div></div>
</div>
<div class="sw" style="background:#FF9F1C;color:#1a1a1a">
  <div>warn · next-due</div>
  <div><div class="row"><span class="dot" style="background:#FF9F1C"></span><span class="dot" style="background:rgba(255,159,28,.3)"></span><span class="dot" style="background:rgba(255,159,28,.2)"></span></div><div class="h" style="color:rgba(0,0,0,.6)">#FF9F1C</div></div>
</div>
<div class="sw" style="background:#E63946;color:#fff">
  <div>danger · overdue</div>
  <div><div class="row"><span class="dot" style="background:#E63946"></span><span class="dot" style="background:rgba(230,57,70,.3)"></span><span class="dot" style="background:rgba(230,57,70,.2)"></span></div><div class="h">#E63946</div></div>
</div>
<div class="sw" style="background:#2EC4B6;color:#0a0a0a">
  <div>success · done</div>
  <div><div class="row"><span class="dot" style="background:#2EC4B6"></span><span class="dot" style="background:rgba(46,196,182,.3)"></span><span class="dot" style="background:rgba(46,196,182,.2)"></span></div><div class="h" style="color:rgba(0,0,0,.6)">#2EC4B6</div></div>
</div>
</body></html>

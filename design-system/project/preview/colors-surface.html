<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--color-bg);display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{height:90px;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-family:Montserrat;font-size:11px;font-weight:500;color:#E6E8EC}
.sw .h{font-size:10px;color:#A1A7B3;letter-spacing:.3px;font-weight:400;font-family:ui-monospace,Menlo,monospace}
.sw.sm{height:64px}
</style></head>
<body>
<div class="sw" style="background:#0F1115;border:1px solid #1A1D24"><div>surface-0</div><div class="h">#0F1115</div></div>
<div class="sw" style="background:#16191F"><div>surface-1</div><div class="h">#16191F</div></div>
<div class="sw" style="background:#1A1D24"><div>surface-2</div><div class="h">#1A1D24</div></div>
<div class="sw" style="background:#22262F"><div>surface-3</div><div class="h">#22262F</div></div>
<div class="sw sm" style="background:#2A2F3A"><div>surface-4</div><div class="h">#2A2F3A</div></div>
<div class="sw sm" style="background:rgba(34,38,47,.9);backdrop-filter:blur(8px)"><div>nav</div><div class="h">22262F · 90%</div></div>
<div class="sw sm" style="background:#000"><div>scrim 50%</div><div class="h">#000 · 50%</div></div>
<div class="sw sm" style="background:#0F1115;color:#6B7280;border:1px dashed #2A2F3A;justify-content:center;align-items:center;text-align:center;font-size:10px"><div>solid black<br>never used</div></div>
</body></html>

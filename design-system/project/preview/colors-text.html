<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);font-family:Montserrat;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cell{padding:14px;border-radius:14px;background:#16191F}
.label{font-size:10px;color:#6B7280;font-family:ui-monospace,Menlo,monospace;margin-bottom:8px;letter-spacing:.4px}
.box{width:100%;height:42px;border-radius:8px;display:flex;align-items:center;padding-left:12px;font-size:13px}
.swatch{display:flex;flex-direction:column;gap:6px}
.tag{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:#A1A7B3}
</style></head>
<body>
<div class="cell"><div class="label">FG-1 · primary</div>
  <div style="font-size:18px;font-weight:500;color:#E6E8EC">Renault Sandero</div>
  <div class="tag">#E6E8EC</div></div>
<div class="cell"><div class="label">FG-2 · label</div>
  <div style="font-size:14px;font-weight:500;color:#A1A7B3">Current Mileage</div>
  <div class="tag">#A1A7B3</div></div>
<div class="cell"><div class="label">FG-3 · stroke</div>
  <div style="font-size:14px;font-weight:500;color:#B0B6C3">Icon strokes</div>
  <div class="tag">#B0B6C3</div></div>
<div class="cell"><div class="label">FG-muted · placeholder</div>
  <div style="font-size:14px;color:#6B7280">Enter mileage</div>
  <div class="tag">#6B7280</div></div>
</body></html>

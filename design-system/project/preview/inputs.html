<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);font-family:Montserrat;color:#E6E8EC;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:14px;font-weight:500;color:#A1A7B3}
.input{height:56px;border-radius:16px;background:#16191F;display:flex;align-items:center;padding:0 16px;gap:12px}
.input.dash{border:1px dashed #2A2F3A;background:#16191F;height:64px;justify-content:center;color:#A1A7B3;font-weight:500}
.ph{color:#6B7280}
.val{color:#E6E8EC}
.icon{width:20px;height:20px;color:#B0B6C3;flex:none}
</style></head>
<body>
<div class="f"><div class="lbl">Maintenance Type *</div><div class="input"><span class="ph" style="flex:1">Select type</span><span class="icon">›</span></div></div>
<div class="f"><div class="lbl">Mileage at Service *</div><div class="input"><span class="icon">⊙</span><span class="val">45,230</span></div></div>
<div class="f"><div class="lbl">Photo (optional)</div><div class="input dash">＋ Add Photo</div></div>
</body></html>

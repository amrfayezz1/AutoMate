<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);font-family:Montserrat;display:flex;align-items:center;gap:32px;color:#E6E8EC}
.glyph{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#3A86FF 0%,#2EC4B6 100%);display:grid;place-items:center;color:#fff;font-weight:600;font-size:32px;letter-spacing:-1.5px;flex:none}
.word{font-weight:500;font-size:34px;letter-spacing:-0.6px}
.word b{font-weight:600;color:#3A86FF}
.tag{font-size:11px;color:#6B7280;font-family:ui-monospace,Menlo,monospace;margin-left:auto}
</style></head>
<body>
<div class="glyph">A</div>
<div class="word">Auto<b>Mate</b></div>
<div class="tag">monogram + wordmark<br>linear-gradient brand→success</div>
</body></html>

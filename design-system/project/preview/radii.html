<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);font-family:Montserrat;display:flex;gap:16px;align-items:center}
.box{background:#1A1D24;display:flex;align-items:center;justify-content:center;color:#A1A7B3;font-family:ui-monospace,Menlo,monospace;font-size:11px;width:100px;height:80px;flex:none}
.r16{border-radius:16px}
.r24{border-radius:24px 24px 0 0}
.rp{border-radius:9999px;width:120px}
.btn{background:#3A86FF;color:#fff;font-family:Montserrat;font-weight:500}
.lab{font-size:10px;color:#6B7280;margin-top:6px;text-align:center;font-family:ui-monospace,Menlo,monospace}
.col{display:flex;flex-direction:column;align-items:center}
</style></head>
<body>
<div class="col"><div class="box r16">card</div><div class="lab">--r-card · 16</div></div>
<div class="col"><div class="box r24">sheet top</div><div class="lab">--r-sheet · 24</div></div>
<div class="col"><div class="box rp btn">Save</div><div class="lab">--r-pill · 9999</div></div>
<div class="col"><div class="box rp btn" style="width:80px;height:40px">Tab</div><div class="lab">tab pill · 40h</div></div>
</body></html>

<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);font-family:Montserrat;color:#E6E8EC;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.spec{padding:14px;border-radius:14px;background:#1A1D24}
.tag{font-size:10px;color:#6B7280;font-family:ui-monospace,Menlo,monospace;margin-top:6px;letter-spacing:.3px}
h4{margin:0 0 4px;font-size:11px;font-weight:500;color:#A1A7B3;text-transform:uppercase;letter-spacing:.6px}
</style></head>
<body>
<div class="spec"><h4>Montserrat 500</h4><div style="font-size:24px;font-weight:500">AaBbCc 0123</div><div class="tag">Medium · headings · numerals · CTAs</div></div>
<div class="spec"><h4>Montserrat 400</h4><div style="font-size:24px;font-weight:400">AaBbCc 0123</div><div class="tag">Regular · body · activity descriptions</div></div>
<div class="spec" style="grid-column:1/-1"><h4>Tabular numerals — 201,240 km · 342.50 LE · 5/5/2026</h4>
  <div class="am-mono-num" style="font-size:22px;font-weight:500;font-feature-settings:'tnum' 1,'lnum' 1">201,240 km · 342.50 LE · 5/5/2026</div>
  <div class="tag">font-feature-settings: "tnum" 1 — values stay aligned as they change</div>
</div>
</body></html>

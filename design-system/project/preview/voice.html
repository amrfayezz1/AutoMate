<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);font-family:Montserrat;color:#E6E8EC;display:flex;flex-direction:column;gap:10px;font-size:14px}
.line{display:flex;gap:14px;align-items:baseline}
.k{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6B7280;width:100px;flex:none}
.v{color:#E6E8EC}
.muted{color:#A1A7B3}
.ok{color:#2EC4B6}
</style></head>
<body>
<div class="line"><span class="k">title case</span><span class="v">Save Maintenance · Switch Car · Add New Car</span></div>
<div class="line"><span class="k">sentence</span><span class="v muted">Oil change completed · Mileage updated to 210,240 km</span></div>
<div class="line"><span class="k">required</span><span class="v">Mileage at Service <span class="muted">*</span></span></div>
<div class="line"><span class="k">optional</span><span class="v">Cost <span class="muted">(optional)</span></span></div>
<div class="line"><span class="k">number</span><span class="v" style="font-feature-settings:'tnum' 1">201,240 km · 342.50 LE</span></div>
<div class="line"><span class="k">date</span><span class="v">May 8, 2026 <span class="muted">/ input</span> 5/5/2026</span></div>
<div class="line"><span class="k">relative</span><span class="v muted">2 days ago · 1 week ago</span></div>
<div class="line"><span class="k">hint</span><span class="v ok">Next service 5/5/2026</span></div>
</body></html>

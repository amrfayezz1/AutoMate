<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoMate — UI kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html,body{margin:0;background:#0b0d11;font-family:Montserrat,sans-serif;color:#E6E8EC}
  body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:48px 16px}
  .stage{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
  .label{font-size:11px;color:#6B7280;letter-spacing:.4px;text-align:center;margin-top:12px;font-family:ui-monospace,Menlo,monospace}
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="tokens.js"></script>
</head>
<body>
<div class="stage">
  <div><div id="root"></div><div class="label" id="lbl"></div></div>
</div>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="PhoneFrame.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel">
const { useState } = React;

const CARS = [
  { id:1, name:'Renault Sandero', plate:'ABC-1234', km:201240 },
  { id:2, name:'Honda Civic',     plate:'ق م ض - 4 1 8 3', km:48200 },
  { id:3, name:'BMW X5',          plate:'ق م ر - 1 1 1 1', km:97400 },
];

function App() {
  const [screen, setScreen] = useState('home'); // home | maint | log
  const [carId, setCarId] = useState(1);
  const [showSwitch, setShowSwitch] = useState(false);
  const car = CARS.find(c=>c.id===carId);

  const lbl = {
    home:'01 Home', maint:'02 Maintenance', log:'03 Log Maintenance',
    remind:'04 Reminders (placeholder)', settings:'05 Settings (placeholder)',
  }[screen];
  React.useEffect(()=>{ document.getElementById('lbl').textContent = lbl + ' · tap nav to switch'; },[lbl]);

  const navTab = screen==='log' ? null
              : screen==='home' ? 'home'
              : screen==='maint' ? 'maint'
              : screen==='remind' ? 'remind'
              : screen==='settings' ? 'settings' : null;

  return (
    <PhoneFrame navTab={navTab} onNav={k=>setScreen(k)} screenLabel={lbl}>
      {screen==='home' && (
        <HomeScreen
          car={car}
          onSwitchCar={()=>setShowSwitch(true)}
          onLog={()=>setScreen('log')}
          onUpdateMileage={()=>setScreen('log')}
          onViewAll={()=>setScreen('maint')}
        />
      )}
      {screen==='maint' && <MaintenanceScreen onLog={()=>setScreen('log')}/>}
      {screen==='log' && <LogMaintenanceScreen onBack={()=>setScreen('home')} onSave={()=>setScreen('home')}/>}
      {screen==='remind' && <Placeholder title="Reminders" sub="Not in source Figma — placeholder."/>}
      {screen==='settings' && <Placeholder title="Settings" sub="Not in source Figma — placeholder."/>}
      {showSwitch && (
        <SwitchCarSheet
          cars={CARS} activeId={carId}
          onPick={id=>{ setCarId(id); setShowSwitch(false); }}
          onAdd={()=>setShowSwitch(false)}
          onClose={()=>setShowSwitch(false)}
        />
      )}
    </PhoneFrame>
  );
}

function Placeholder({ title, sub }) {
  return (
    <div style={{ padding:'24px 16px', fontFamily:AM.font, color:AM.c.fg1 }}>
      <h1 style={{ fontSize:20, fontWeight:500, margin:0 }}>{title}</h1>
      <p style={{ fontSize:14, color:AM.c.fg2, marginTop:12 }}>{sub}</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
